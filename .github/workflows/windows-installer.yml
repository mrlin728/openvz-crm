name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the installer to this release tag (blank = artefact only)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer (x64, unsigned)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the installer
        run: bun run --filter=desktop build:installer

      - name: Smoke-test the payload
        shell: pwsh
        run: |
          $payload = "apps\desktop\payload\windows-x64"
          $env:OPENVZ_CRM_RUNTIME = (Resolve-Path $payload).Path
          $env:OPENVZ_CRM_HOME = "$env:RUNNER_TEMP\crm-smoke"

          $bun = Join-Path $env:OPENVZ_CRM_RUNTIME "bun.exe"
          $proc = Start-Process -FilePath $bun `
            -ArgumentList "run", (Join-Path $env:OPENVZ_CRM_RUNTIME "supervisor.js") `
            -PassThru -NoNewWindow

          $state = "$env:OPENVZ_CRM_HOME\state.json"
          $ok = $false
          foreach ($i in 1..180) {
            Start-Sleep -Seconds 2
            if (Test-Path $state) {
              $url = (Get-Content $state | ConvertFrom-Json).appUrl
              try {
                $r = Invoke-WebRequest -Uri "$url/sign-in" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if ($proc.HasExited) { break }
          }

          if (-not $ok) {
            Write-Host "--- postgres ---"
            Get-Content "$env:OPENVZ_CRM_HOME\logs\postgres.log" -Tail 40 -ErrorAction SilentlyContinue
            Write-Host "--- api ---"
            Get-Content "$env:OPENVZ_CRM_HOME\logs\api.log" -Tail 40 -ErrorAction SilentlyContinue
            Write-Host "--- interface ---"
            Get-Content "$env:OPENVZ_CRM_HOME\logs\app.log" -Tail 40 -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "The payload never served the sign-in page."
          }

          Write-Host "The sign-in page answered."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          & "$env:OPENVZ_CRM_RUNTIME\postgres\bin\pg_ctl.exe" -D "$env:OPENVZ_CRM_HOME\postgres\data" -m fast stop

      - name: Checksum
        shell: pwsh
        run: |
          $out = "apps\desktop\src-tauri\target\release\bundle\nsis"
          $file = Get-ChildItem "$out\*.exe" | Select-Object -First 1
          if (-not $file) { throw "No installer was produced." }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii "$($file.FullName).sha256"
          Write-Host "$hash  $($file.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $files = (Get-ChildItem "apps\desktop\src-tauri\target\release\bundle\nsis\*").FullName
          gh release upload $tag $files --clobber --repo ${{ github.repository }}
