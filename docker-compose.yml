
services:
  postgres:
    image: postgres:17-alpine
    container_name: openvz-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openvz_crm
    ports:
      - "5432:5432"
    volumes:
      - openvz-crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openvz_crm"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  openvz-crm-postgres:
